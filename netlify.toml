# Site publié depuis ce dossier, sans étape de build.
[build]
  publish = "."
  command = ""

# Liens de recommandation envoyés par n8n (WhatsApp/SMS) : /r/CODE.
# Réécriture (l'adresse reste /r/CODE) vers la page d'atterrissage r/index.html,
# dont le script transmet CODE à Calendly dans utm_content. Le workflow n8n lit
# utm_content pour retrouver le parrain : ne pas renommer ce paramètre.
[[redirects]]
  from = "/r/*"
  to = "/r/index.html"
  status = 200
  force = true

# Page d'arrivée des annonces Google Ads, servie sans .html.
[[redirects]]
  from = "/bilan-patrimonial-offert"
  to = "/bilan-patrimonial-offert.html"
  status = 200

# En-têtes de sécurité sur tout le site (le site n'est jamais affiché dans un cadre extérieur).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Scripts, photos et icônes : cache d'un jour, puis revalidation en arrière-plan.
# (Les fichiers ne sont pas versionnés : un cache plus long retarderait les mises à jour.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
