# Site publié depuis ce dossier, sans étape de build.
[build]
  publish = "."
  command = ""

# Liens de recommandation envoyés par n8n (WhatsApp/SMS) : /r/CODE.
# Réécriture (l'adresse reste /r/CODE) vers la page d'atterrissage r/index.html,
# dont le script transmet CODE à Calendly dans utm_content. Le workflow n8n lit
# utm_content pour retrouver le parrain : ne pas renommer ce paramètre.
[[redirects]]
  from = "/r/*"
  to = "/r/index.html"
  status = 200
  force = true

# Page d'arrivée des annonces Google Ads, servie sans .html.
[[redirects]]
  from = "/bilan-patrimonial-offert"
  to = "/bilan-patrimonial-offert.html"
  status = 200
